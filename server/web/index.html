<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SilkloraAI Hub</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <div class="brand">
                <span class="brand-mark" id="brandMark"></span>
                <span class="brand-name" data-i18n="appName"></span>
            </div>
            <nav class="nav" id="nav">
                <button class="nav-btn active" data-view="home" data-i18n="navHome"></button>
                <button class="nav-btn" data-view="models" data-i18n="navModels"></button>
                <button class="nav-btn" data-view="system" data-i18n="navSystem"></button>
            </nav>
            <div class="topbar-right">
                <span class="pill" id="statusPill"><span class="dot"></span><span id="statusPillText"></span></span>
                <div class="lang" id="lang">
                    <button data-lang="ru">RU</button>
                    <button data-lang="en">EN</button>
                </div>
            </div>
        </div>
    </header>

    <div class="banner" id="banner" hidden></div>

    <main class="container">
        <section class="view active" id="view-home"></section>
        <section class="view" id="view-models"></section>
        <section class="view" id="view-system"></section>
    </main>

    <div class="download-bar" id="downloadBar" hidden></div>

    <script src="/static/qrcode.min.js"></script>
    <script src="/static/i18n.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
